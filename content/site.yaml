# Markdown. Shown on /about.
about: |
  I started out writing WordPress plugins for a print shop in Szeged, moved
  to the Netherlands in 2018 and have been writing Laravel professionally
  since.

  Most of my work sits between a product and the outside world: payment
  providers, carrier APIs, accounting exports. I like that kind of work
  because it fails in specific, reproducible ways, and a small fix can stop
  a whole category of support tickets.

  Outside work I maintain a small PHP library for recurring schedules and
  help run the Rotterdam PHP meetup.

contact_note: >
  The fastest way to reach me is email. I answer everything within two
  working days. Recruiters welcome, but please include the salary range.

